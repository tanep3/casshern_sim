<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casshern Sim</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* HUD Container */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 280px;
      /* 設定パネルの幅分空ける */
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent);
      pointer-events: none;
      z-index: 100;
    }

    /* Faction Panels */
    .faction-panel {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 150px;
    }

    .faction-panel.andro {
      text-align: left;
      color: #ff6b6b;
    }

    .faction-panel.human {
      text-align: right;
      color: #4dabf7;
    }

    .faction-name {
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .faction-count {
      font-size: 28px;
      font-weight: bold;
    }

    /* HP Bar */
    .hp-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
    }

    .hp-bar {
      height: 100%;
      transition: width 0.3s ease;
    }

    .hp-bar.andro {
      background: linear-gradient(to right, #ff6b6b, #fa5252);
    }

    .hp-bar.human {
      background: linear-gradient(to left, #4dabf7, #339af0);
    }

    /* Center Phase Display */
    .phase-container {
      text-align: center;
      color: white;
    }

    .phase-label {
      font-size: 12px;
      opacity: 0.7;
    }

    .phase-value {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .phase-value.early {
      color: #51cf66;
    }

    .phase-value.mid {
      color: #fcc419;
    }

    .phase-value.late {
      color: #ff6b6b;
    }

    /* Casshern Status */
    .casshern-status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 20px;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .casshern-toggle {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .casshern-toggle:hover {
      transform: scale(1.05);
    }

    .casshern-toggle.manual {
      background: linear-gradient(135deg, #f093fb, #f5576c);
    }

    .casshern-mode-btn {
      background: rgba(100, 100, 100, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .casshern-mode-btn:hover {
      background: rgba(150, 150, 150, 0.6);
    }

    .casshern-mode-btn.active {
      background: linear-gradient(135deg, #f5af19, #f12711);
      border-color: #fff;
      font-weight: bold;
    }

    /* Evolution Gauge */
    .evolution-gauge {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .weapon-slot {
      width: 28px;
      height: 28px;
      background: rgba(100, 255, 100, 0.3);
      border: 2px solid rgba(100, 255, 100, 0.8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.3s;
    }

    .weapon-slot.locked {
      background: rgba(100, 100, 100, 0.3);
      border-color: rgba(100, 100, 100, 0.5);
      opacity: 0.4;
    }

    .weapon-slot.unlocked {
      background: rgba(100, 255, 100, 0.5);
      border-color: rgba(100, 255, 100, 1);
      opacity: 1;
      animation: unlock-pulse 0.5s ease-out;
    }

    @keyframes unlock-pulse {
      0% {
        transform: scale(1.3);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Settings Panel - Always Visible on Right */
    .settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px;
      z-index: 99;
      overflow-y: auto;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
    }

    .settings-title {
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .setting-value {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .setting-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
    }

    .setting-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4dabf7;
      cursor: pointer;
    }

    .setting-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4dabf7;
      cursor: pointer;
      border: none;
    }

    .restart-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #4dabf7, #339af0);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s ease;
    }

    .restart-btn:hover {
      transform: scale(1.02);
    }

    /* Adjust canvas to account for settings panel */
    #sim-canvas {
      width: calc(100vw - 280px) !important;
    }
  </style>
</head>

<body>
  <canvas id="sim-canvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="faction-panel andro">
      <div class="faction-name">アンドロ軍団</div>
      <div class="faction-count" id="andro-count">0</div>
      <div class="hp-bar-container">
        <div class="hp-bar andro" id="andro-hp" style="width: 100%"></div>
      </div>
    </div>

    <div class="phase-container">
      <div class="phase-label">PHASE</div>
      <div class="phase-value" id="phase-display">EARLY</div>
      <div class="evolution-gauge" id="evolution-gauge">
        <div class="weapon-slot" id="weapon-0" title="Basic">🔫</div>
        <div class="weapon-slot locked" id="weapon-1" title="Spread Gun">🔥</div>
        <div class="weapon-slot locked" id="weapon-2" title="Sniper">🎯</div>
        <div class="weapon-slot locked" id="weapon-3" title="Melee">⚔️</div>
      </div>
    </div>

    <div class="faction-panel human">
      <div class="faction-name">人類軍</div>
      <div class="faction-count" id="human-count">0</div>
      <div class="hp-bar-container">
        <div class="hp-bar human" id="human-hp" style="width: 100%"></div>
      </div>
    </div>
  </div>

  <div class="casshern-status" id="casshern-status">
    キャシャーン AI: <span id="casshern-mode-text">殲滅</span>
    <button id="casshern-assault-btn" class="casshern-mode-btn">突撃</button>
    <button id="casshern-support-btn" class="casshern-mode-btn">援護</button>
    <button id="casshern-annihilate-btn" class="casshern-mode-btn active">殲滅</button>
  </div>

  <!-- Settings Panel (Always Visible) -->
  <div class="settings-panel">
    <div class="settings-title">⚙ 設定</div>

    <div class="setting-group">
      <div class="setting-label">アンドロ軍団</div>
      <div class="setting-value" id="andro-units-value">500</div>
      <input type="range" class="setting-slider" id="andro-units-slider" min="10" max="10000" step="10" value="500">
    </div>

    <div class="setting-group">
      <div class="setting-label">人類軍</div>
      <div class="setting-value" id="human-units-value">500</div>
      <input type="range" class="setting-slider" id="human-units-slider" min="10" max="10000" step="10" value="500">
    </div>

    <div class="setting-group">
      <div class="setting-label">AI更新間隔</div>
      <div class="setting-value" id="ai-interval-value">3</div>
      <input type="range" class="setting-slider" id="ai-interval-slider" min="1" max="10" step="1" value="3">
    </div>

    <div class="setting-group">
      <div class="setting-label">進化間隔 (秒)</div>
      <div class="setting-value" id="phase-interval-value">20</div>
      <input type="range" class="setting-slider" id="phase-interval-slider" min="1" max="180" step="1" value="20">
    </div>

    <div class="setting-group">
      <div class="setting-label">人類移動速度率</div>
      <div class="setting-value" id="human-speed-value">1.0</div>
      <input type="range" class="setting-slider" id="human-speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="setting-group">
      <div class="setting-label">視界範囲 (px)</div>
      <div class="setting-value" id="vision-value">80</div>
      <input type="range" class="setting-slider" id="vision-slider" min="10" max="200" step="1" value="80">
    </div>

    <div class="setting-group">
      <div class="setting-label">アンドロ攻撃力</div>
      <div class="setting-value" id="andro-dmg-value">10</div>
      <input type="range" class="setting-slider" id="andro-dmg-slider" min="1" max="200" step="1" value="10">
    </div>

    <div class="setting-group">
      <div class="setting-label">人類攻撃力</div>
      <div class="setting-value" id="human-dmg-value">10</div>
      <input type="range" class="setting-slider" id="human-dmg-slider" min="1" max="200" step="1" value="10">
    </div>

    <div class="setting-group">
      <div class="setting-label">四天王 強さ倍率</div>
      <div class="setting-value" id="elite-mult-value">25.0</div>
      <input type="range" class="setting-slider" id="elite-mult-slider" min="1" max="1000" step="1" value="25">
    </div>

    <div class="setting-group">
      <div class="setting-label">ブロッケンJr 強さ倍率</div>
      <div class="setting-value" id="brocken-mult-value">100.0</div>
      <input type="range" class="setting-slider" id="brocken-mult-slider" min="1" max="1000" step="1" value="100">
    </div>

    <div class="setting-group">
      <div class="setting-label">キャシャーン 強さ倍率</div>
      <div class="setting-value" id="casshern-mult-value">200.0</div>
      <input type="range" class="setting-slider" id="casshern-mult-slider" min="1" max="1000" step="1" value="200">
    </div>

    <button class="restart-btn" id="restart-btn">🔄 シミュレーション再起動</button>

    <div style="margin-top: 14px; text-align: center; color: rgba(255,255,255,0.45); font-size: 11px;">
      Casshern Sim v%APP_VERSION%
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
